name: Carro balancín para uno o dos drones
brand: AgroFenix
model: Carro balancín para uno o dos drones
description: >-
  CARRO PARA 2 DRONES AGROFENIX - POTENCIA Y CAPACIDAD PARA GRANDES OPERACIONES

  Está diseñado para quienes necesitan su máxima autonomía y eficiencia en el
  trabajo con drones agrícolas. Su estructura robusta y funcional permite
  transportar y operar uno o dos drones con total comodidad y seguridad.

  CAPACIDAD TOTAL:

  Hasta 2 drones 

  2 generadores y sus baterías

  Mixer y equipamiento adicional

  DISEÑO INTELIGENTE Y ROBUSTO:

  Medidas: 4m de largo x 2,10m de ancho x 2m de alto 

  Bandejas extraíbles reforzadas para dos drones y dos grupos electrónicos 

  Dos tanques de agua de 750lts cada uno, otorgando una autonomía total de
  1500lts

  Espacio trasero funcional para mixer u otros accesorios

  Tres puertas laterales y una trasera levadizas con resortes a gas, para acceso
  rápido y trabajo cómodo bajo sombra

  Escalera en la lanza con acceso a la plataforma superior para el operario,
  equipada con barandas de seguridad

  Luces traseras y enganche regulable en altura para adaptarse a distintas
  unidades de tiro

  Llantas rodado 16 simples (sin cubiertas)

  Color a elección, perzonalizable según tu marca o emprendimiento
