name: AM 4522
brand: AGRIN METAL
model: AM 4522
description: >-
  El acoplado AM 4522 para drones está diseñado para operación, transporte y
  soporte técnico de drones agrícolas en el campo, permitiendo centralizar todas
  las tareas en una unidad móvil.


  ​Cuenta con una capacidad de carga de 4000 kg y un amplio espacio interior que
  permite el transporte seguro de drones, baterías, insumos y herramientas,
  optimizando la logística durante las jornadas de trabajo.



  Su estructura robusta incorpora chasis construido en chapa de 3/16",
  garantizando resistencia en condiciones exigentes. Dispone de compuertas de
  gran apertura, escalera rebatible y espacios de almacenamiento, facilitando la
  organización y operación del equipo.


  El equipo cuenta con trabas de seguridad en compuertas, sistema de sujeción de
  puertas y cadenas de seguridad en el enganche, asegurando un transporte
  confiable y protección del equipamiento.


  Como equipamiento opcional, puede incorporar sistema de frenos y distintas
  configuraciones de neumáticos, adaptándose a distintas condiciones de trabajo
  en el campo.
