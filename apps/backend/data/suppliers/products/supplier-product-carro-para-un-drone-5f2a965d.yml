name: Carro para un Drone
brand: AgroFenix
model: Carro para un Drone
description: >-
  Potencia tus operaciones agrícolas con el carro AgroFenix, diseñado
  especialmente para el transporte y manejo de drones agrícolas de hasta T100,
  junto a todo el equipamiento que necesitas en una sola unidad.

  Capacidad total:

  1 grupo electrógeno

  1 drone (hasta modelo T100)

  1 mixer

  Diseño inteligente y funcional:

  Medidas: 3 mts largo x 1,70 m ancho x 2 m alto.

  Bandeja corrediza reforzada, ideal para ubicar tanto el drone como el grupo
  eléctrico, permitiendo un acceso rápido y seguro.

  Tanque de 850 LTS, ubicado estratégicamente para brindar máxima estabilidad a
  la unidad.

  Puertas levadizas con resortes a gas, que facilitan el acceso y protegen del
  sol.

  Plataforma superior para el operario, ofreciendo una visión y control óptimos
  del drone gracias a su altura de 2 metros.

  Llantas duales R14 (sin cubiertas)

  Color a elección, adaptable a la imagen de tu empresa o emprendimiento.
