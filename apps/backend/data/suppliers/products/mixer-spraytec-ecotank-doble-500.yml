name: Mezclador Ecotank Drone 500L
brand: SprayTec
model: Mezclador Ecotank Doble 500L
description: >-
  El Ecotank es un Equipo de premezcla de Agroquímicos que mejora la calidad y
  los tiempos de preparación del caldo de pulverización, asegurando una mezcla
  homogénea para un alto rendimiento. Este equipo está disponible en dos
  versiones Full y para drones con tanques de: 200, 500, 1000 y 1500 litros.
  También cuenta una nueva versión con doble tanque de 500 litros, que permite
  preparar dos mezclas de manera simultánea y las Estaciones de pre mezcla para
  drones de 200/500 y 700/1000 Lts.

  Gracias a su sistema de bombeo y válvulas de mezcla, garantiza un caldo
  homogéneo, una agitación constante de alto caudal, reduciendo obstrucciones en
  los picos pulverizadores y asegurando una aplicación eficiente. Reduce los
  tiempos muertos en la preparación y carga de caldo.

  Además, mejora las condiciones de trabajo ya que reduce el contacto directo
  con productos químicos, ofreciendo mayor seguridad y comodidad.
